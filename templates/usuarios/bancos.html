<div class="card">

    <div
    style="
    font-size:28px;
    font-weight:700;
    margin-bottom:10px;
    ">

    Bancos

    </div>

    <div
    style="
    color:#8b93a7;
    margin-bottom:30px;
    ">

    Administración de bancos.

    </div>

    <div
    style="
    display:flex;
    gap:12px;
    margin-bottom:20px;
    ">

    <input
    id="nuevoBanco"
    class="input-box"
    placeholder="Nombre del banco">

    <button
    id="btnGuardarBanco"
    class="guardar"
    style="
    width:180px;
    margin-top:0;
    ">

    Guardar

    </button>

    </div>

    <div
    id="grillaBancos"
    style="
    display:flex;
    flex-direction:column;
    gap:10px;
    ">

    {% for banco in bancos %}

    <div
    style="
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 18px;
    background:#1b2130;
    border:1px solid #2b3447;
    border-radius:14px;
    ">

        <div>

            {{ banco.nombre }}

        </div>

        <div
        style="
        display:flex;
        gap:8px;
        ">

            <button
            class="action-btn">

                Modificar

            </button>

            <button
            class="action-btn"
            style="
            background:#7f1d1d;
            border-color:#991b1b;
            ">

                Eliminar

            </button>

        </div>

    </div>

    {% empty %}

    <div
    style="
    color:#8b93a7;
    padding:20px;
    text-align:center;
    ">

        No hay bancos cargados.

    </div>

    {% endfor %}

    </div>

</div>

<div
style="
display:flex;
justify-content:flex-end;
margin-top:30px;
">

    <button
    id="btnVolverBanco"
    type="button"
    class="action-btn">

    ← Volver

    </button>

</div>
