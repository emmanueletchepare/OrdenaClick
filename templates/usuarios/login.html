<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ordenaclick</title>

    <!-- GOOGLE FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            height:100vh;
            background:#0f1115;
            font-family:'Inter', sans-serif;

            display:flex;
            justify-content:center;
            align-items:center;

            color:#e5e7eb;
        }

        /* CONTENEDOR */

        .login-wrapper{
            width:100%;
            max-width:420px;
            padding:25px;
        }

        .login-box{
            background:#171a21;
            border:1px solid #262a33;

            border-radius:20px;

            padding:40px;
        }

        /* LOGO */

        .logo{
            font-size:34px;
            font-weight:600;

            margin-bottom:10px;
            letter-spacing:0.5px;
        }

        .logo .ordena{
            color:#f3f4f6;
        }

        .logo .click{
            color:#3b82f6;
        }

        .title{
            font-size:28px;
            font-weight:600;
            margin-bottom:10px;
            line-height:1.2;
        }

        .title .ordena{
            color:#f3f4f6;
        }

        .title .click{
            color:#3b82f6;
        }

        .subtitle{
            font-size:14px;
            color:#9ca3af;

            margin-bottom:35px;
            line-height:1.5;
        }

        /* FORM */

        .form-group{
            margin-bottom:18px;
        }

        .label{
            display:block;
            margin-bottom:8px;

            font-size:14px;
            color:#cbd5e1;
        }

        .input-box{
            width:100%;
            height:48px;

            background:#111318;

            border:1px solid #2b2f3a;
            border-radius:10px;

            padding:0 14px;

            color:#f9fafb;
            font-size:14px;

            outline:none;
            transition:0.2s;
        }

        .input-box::placeholder{
            color:#6b7280;
        }

        .input-box:focus{
            border-color:#3b82f6;
        }

        /* AUTOFILL */

        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus{
            -webkit-text-fill-color:#f9fafb;
            -webkit-box-shadow:0 0 0px 1000px #111318 inset;
            transition:background-color 9999s ease-in-out 0s;
            border:1px solid #2b2f3a;
        }

        /* BOTON */

        .btn{
            width:100%;
            height:48px;

            border:none;
            border-radius:10px;

            background:#2563eb;
            color:white;

            font-size:14px;
            font-weight:600;

            cursor:pointer;
            transition:0.2s;

            margin-top:10px;
        }

        .btn:hover{
            background:#1d4ed8;
        }

        /* LINKS */

        .links{
            margin-top:28px;

            display:flex;
            flex-direction:column;
            gap:12px;
        }

        .links a{
            text-decoration:none;

            color:#9ca3af;
            font-size:14px;

            transition:0.2s;
        }

        .links a:hover{
            color:#f3f4f6;
        }

        /* RESPONSIVE */

        @media (max-width:480px){

            .login-box{
                padding:30px 25px;
            }

            .logo{
                font-size:28px;
            }

            .title{
                font-size:24px;
            }

        }

    </style>
</head>

<body>

    <div class="login-wrapper">

        <div class="login-box">

            <div class="logo">
                <span class="ordena">Ordena</span><span class="click">click</span>
            </div>

            <div class="title">
                <span class="ordena">Iniciar</span> <span class="click">sesión</span>
            </div>

            <div class="subtitle">
                Ingresá al sistema utilizando tu usuario y contraseña.
            </div>

            <form method="POST">

                {% csrf_token %}

                <div class="form-group">

                    <label class="label">
                        Usuario
                    </label>

                    <input
                        type="text"
                        name="username"
                        placeholder="Ingresá tu usuario"
                        class="input-box"
                    >

                </div>

                <div class="form-group">

                    <label class="label">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Ingresá tu contraseña"
                        class="input-box"
                    >

                </div>

                <button type="submit" class="btn">
                    Ingresar
                </button>

            </form>

            <div class="links">

                <a href="#">
                    No recuerdo mi contraseña
                </a>

                <a href="{% url 'registro' %}">
                    Quiero registrarme
                </a>

            </div>

        </div>

    </div>

</body>
</html>
