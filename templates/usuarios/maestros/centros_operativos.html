<div class="card">

    <div
    style="
    font-size:28px;
    font-weight:700;
    margin-bottom:10px;
    ">

        Centros Operativos

    </div>

    <div
    style="
    color:#8b93a7;
    margin-bottom:30px;
    ">

        Administración de centros operativos.

    </div>

    <div
    style="
    display:grid;
    grid-template-columns:2fr 1fr 2fr auto;
    gap:12px;
    align-items:end;
    margin-bottom:20px;
    ">

        <div>

            <label class="label">
                Nombre
            </label>

            <input
            id="nuevoCentroOperativo"
            class="input-box"
            placeholder="Nombre del centro operativo">

        </div>

        <div>

            <label class="label">
                Tipo
            </label>

            <select
            id="tipoCentroOperativo"
            class="input-box">

                <option value="">
                    Seleccione...
                </option>

                <option value="Casa Central">
                    Casa Central
                </option>

                <option value="Sucursal">
                    Sucursal
                </option>

                <option value="Deposito">
                    Depósito
                </option>

                <option value="Mostrador">
                    Mostrador
                </option>

            </select>

        </div>

        <div>

            <label class="label">
                Dirección
            </label>

            <input
            id="direccionCentroOperativo"
            class="input-box"
            placeholder="Dirección">

        </div>

        <div
        style="
        display:flex;
        gap:12px;
        ">

            <button
            id="btnGuardarCentroOperativo"
            type="button"
            class="guardar"
            style="
            width:180px;
            margin-top:0;
            ">

                Guardar

            </button>

            <button
            id="btnCancelarCentroOperativo"
            type="button"
            class="action-btn"
            style="
            display:none;
            width:180px;
            margin-top:0;
            ">

               Cancelar

            </button>

        </div>

    </div>

    <div
    style="
    border-top:1px solid #2b3447;
    margin-top:28px;
    padding-top:24px;
    margin-bottom:16px;
    "
    >

        <label
        class="label"
        for="buscarCentroOperativoABM"
        style="
        display:block;
        margin-bottom:8px;
        "
        >
            Buscar centro operativo
        </label>

        <input
        id="buscarCentroOperativoABM"
        type="text"
        class="input-box"
        placeholder="Buscar por nombre, tipo o dirección"
        autocomplete="off">

    </div>

    <div
    id="grillaCentrosOperativos"
    style="
    display:flex;
    flex-direction:column;
    gap:10px;
    ">

        {% for centro in centros %}

        <div
        class="tarjeta-centro-operativo-abm"
        data-busqueda="
            {{ centro.nombre|default:''|escape }}
            {{ centro.tipo|default:''|escape }}
            {{ centro.direccion|default:''|escape }}
        "
        style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        padding:14px 18px;
        background:#1b2130;
        border:1px solid #2b3447;
        border-radius:14px;
        ">

            <div>

                <div
                style="
                font-weight:700;
                margin-bottom:5px;
                ">

                    {{ centro.nombre }}

                </div>

                <div
                style="
                color:#8b93a7;
                font-size:14px;
                ">

                    {{ centro.tipo }}

                    {% if centro.direccion %}

                        · {{ centro.direccion }}

                    {% endif %}

                </div>

            </div>

            <div
            style="
            display:flex;
            gap:8px;
            ">

                <button
                type="button"
                class="action-btn"
                onclick="modificarCentroOperativo(
                    '{{ centro.id }}',
                    '{{ centro.nombre|escapejs }}',
                    '{{ centro.tipo|escapejs }}',
                    '{{ centro.direccion|escapejs }}'
                )">

                    Modificar

                </button>

                <button
                type="button"
                class="action-btn"
                style="
                background:#7f1d1d;
                border-color:#991b1b;
                "
                onclick="eliminarCentroOperativo(
                    '{{ centro.id }}',
                    '{{ centro.nombre|escapejs }}'
                )">

                    Eliminar

                </button>

            </div>

        </div>

        {% empty %}

        <div
        style="
        color:#8b93a7;
        padding:20px;
        text-align:center;
        ">

            No hay centros operativos cargados.

        </div>

        {% endfor %}

    </div>

    <div
    id="sinResultadosCentroOperativoABM"
    style="
    display:none;
    color:#8b93a7;
    padding:20px;
    text-align:center;
    "
    >
        No se encontraron centros operativos.
    </div>

</div>

<div
style="
display:flex;
justify-content:flex-end;
margin-top:30px;
">

    <button
    id="btnVolverCentroOperativo"
    type="button"
    class="action-btn">

        ← Volver

    </button>

</div>
