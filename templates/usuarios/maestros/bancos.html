<div class="card">

    <div
    style="
    font-size:28px;
    font-weight:700;
    margin-bottom:10px;
    ">

    Bancos

    </div>

    <div
    style="
    color:#8b93a7;
    margin-bottom:30px;
    ">

    Administración de bancos.

    </div>

    <div
    style="
    display:flex;
    gap:12px;
    margin-bottom:20px;
    ">

    <input
    id="nuevoBanco"
    class="input-box"
    placeholder="Nombre del banco">

    <button
    id="btnGuardarBanco"
    type="button"
    class="guardar"
    style="
    width:180px;
    margin-top:0;
    ">

    Guardar

    </button>

    <button
    id="btnCancelarBanco"
    type="button"
    class="action-btn"
    style="
    display:none;
    width:180px;
    margin-top:0;
    ">

    Cancelar

    </button>

    </div>

    <div
    style="
    border-top:1px solid #2b3447;
    margin-top:28px;
    padding-top:24px;
    margin-bottom:16px;
    "
    >

        <label
        class="label"
        for="buscarBancoABM"
        style="
        display:block;
        margin-bottom:8px;
        "
        >

            Buscar banco

        </label>

        <input
        id="buscarBancoABM"
        type="text"
        class="input-box"
        placeholder="Buscar por nombre"
        autocomplete="off">

    </div>

    <div
    id="grillaBancos"
    style="
    display:flex;
    flex-direction:column;
    gap:10px;
    ">

    {% for banco in bancos %}

    <div
    class="tarjeta-banco-abm"
    data-busqueda="{{ banco.nombre|default:''|escape }}"
    style="
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 18px;
    background:#1b2130;
    border:1px solid #2b3447;
    border-radius:14px;
    ">

        <div>

            {{ banco.nombre }}

        </div>

        <div
        style="
        display:flex;
        gap:8px;
        ">

            <button
            type="button"
            class="action-btn"
            onclick="modificarBanco(
                '{{ banco.id }}',
                '{{ banco.nombre|escapejs }}'
            )">

                Modificar

            </button>

            <button
            type="button"
            class="action-btn"
            style="
            background:#7f1d1d;
            border-color:#991b1b;
            "
            onclick="eliminarBanco(
                '{{ banco.id }}',
                '{{ banco.nombre|escapejs }}'
            )">

                Eliminar

            </button>

        </div>

    </div>

    <div
    id="sinResultadosBancoABM"
    style="
    display:none;
    color:#8b93a7;
    padding:20px;
    text-align:center;
    "
    >

        No se encontraron bancos.

    </div>

    {% empty %}

    <div
    style="
    color:#8b93a7;
    padding:20px;
    text-align:center;
    ">

        No hay bancos cargados.

    </div>

    {% endfor %}

    </div>

</div>

<div
style="
display:flex;
justify-content:flex-end;
margin-top:30px;
">

    <button
    id="btnVolverBanco"
    type="button"
    class="action-btn">

    ← Volver

    </button>

</div>
